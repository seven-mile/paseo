name: Android APK Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string
      checkout_ref:
        description: "Source ref for a non-publishing candidate."
        required: false
        default: ""
        type: string
      publish:
        description: "Publish through EAS, or build a test-signed ARM64 APK artifact."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  ensure-release:
    if: github.event_name != 'workflow_dispatch' || inputs.publish != 'false'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
            --draft
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
            node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG" >/dev/null
          fi

  publish-android-apk:
    needs: [ensure-release]
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        id: eas_build
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app

          build_json="$(npx eas build --platform android --profile production-apk --non-interactive --wait --json)"
          echo "$build_json" > "$RUNNER_TEMP/eas-build.json"

          build_id="$(jq -r 'if type == "array" then .[0].id // empty else .id // empty end' "$RUNNER_TEMP/eas-build.json")"
          if [ -z "$build_id" ]; then
            echo "Failed to determine EAS build ID."
            cat "$RUNNER_TEMP/eas-build.json"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Resolve APK artifact URL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app

          build_view_json="$(npx eas build:view '${{ steps.eas_build.outputs.build_id }}' --json)"
          echo "$build_view_json" > "$RUNNER_TEMP/eas-build-view.json"

          artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$RUNNER_TEMP/eas-build-view.json")"
          if [ -z "$artifact_url" ]; then
            echo "Failed to determine APK artifact URL."
            cat "$RUNNER_TEMP/eas-build-view.json"
            exit 1
          fi

          asset_name="paseo-${RELEASE_TAG}-android.apk"
          asset_path="$RUNNER_TEMP/$asset_name"

          curl --fail --location --output "$asset_path" "$artifact_url"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup="$(node scripts/github-release.mjs --repo "${{ github.repository }}" --tag "$RELEASE_TAG")"
          gh release upload "$release_lookup" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"

  build-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'false'
    permissions:
      contents: read
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      APP_VARIANT: production
      ONNXRUNTIME_NODE_INSTALL: skip
      NODE_OPTIONS: --max-old-space-size=4096
      CANDIDATE_REF: ${{ inputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || inputs.tag }}
      - name: Verify immutable candidate source
        run: |
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REF"
      - name: Initialize candidate diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-candidate-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/android-candidate-evidence/source-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/android-candidate-evidence/workflow-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/android-candidate-evidence/run-attempt.txt"
          printf '%s\n' "publish=false" "checkout_ref=$CANDIDATE_REF" "tag=$SOURCE_TAG" > "$RUNNER_TEMP/android-candidate-evidence/inputs.txt"
          shasum -a 256 package-lock.json > "$RUNNER_TEMP/android-candidate-evidence/lock-sha256.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and prepare app dependencies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/npm-retry.mjs ci 2>&1 | tee "$RUNNER_TEMP/android-candidate-evidence/npm-ci.log"
          npm run eas-build-post-install --workspace=@getpaseo/app 2>&1 | tee "$RUNNER_TEMP/android-candidate-evidence/app-hooks.log"
      - name: Prebuild production Android
        id: candidate_prebuild
        working-directory: packages/app
        shell: bash
        run: |
          set -euo pipefail
          date -u +%FT%TZ > "$RUNNER_TEMP/android-candidate-evidence/prebuild-start.txt"
          npx expo prebuild --platform android --clean --no-install 2>&1 | tee "$RUNNER_TEMP/android-candidate-evidence/prebuild.log"
          date -u +%FT%TZ > "$RUNNER_TEMP/android-candidate-evidence/prebuild-end.txt"
      - name: Build self-contained test-signed ARM64 APK
        id: candidate_build
        timeout-minutes: 100
        working-directory: packages/app/android
        shell: bash
        run: |
          set -euo pipefail
          date -u +%FT%TZ > "$RUNNER_TEMP/android-candidate-evidence/gradle-start.txt"
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=1 -Dorg.gradle.parallel=false --info --console=plain 2>&1 | tee "$RUNNER_TEMP/android-candidate-evidence/gradle.log"
          date -u +%FT%TZ > "$RUNNER_TEMP/android-candidate-evidence/gradle-end.txt"
      - name: Record candidate identity and signature
        run: |
          mkdir -p candidate
          cp packages/app/android/app/build/outputs/apk/release/*.apk candidate/
          git rev-parse HEAD > candidate/source-commit.txt
          printf '%s\n' "$GITHUB_SHA" > candidate/workflow-commit.txt
          node -p "require('./packages/app/package.json').version" > candidate/source-version.txt
          printf '%s\n' 'production ID sh.paseo; Expo template debug signing key; ARM64 only; cannot assume upgrade over official installation; use an isolated device; no release publication; push credentials unavailable' > candidate/limitations.txt
          { node --version; npm --version; java -version; } > candidate/tool-versions.txt 2>&1
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$tools" verify --print-certs candidate/*.apk > candidate/signature.txt
          "$(dirname "$tools")/aapt" dump badging candidate/*.apk > candidate/package.txt
          shasum -a 256 candidate/*.apk > candidate/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-candidate-arm64-test-signed
          path: candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve existing Android diagnostics
        if: always()
        timeout-minutes: 3
        shell: bash
        env:
          PREBUILD_OUTCOME: ${{ steps.candidate_prebuild.outcome }}
          BUILD_OUTCOME: ${{ steps.candidate_build.outcome }}
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/android-candidate-evidence"
          mkdir -p "$diag/generated"
          printf '%s\n' "prebuild=$PREBUILD_OUTCOME" "build=$BUILD_OUTCOME" > "$diag/step-outcomes.txt"
          date -u +%FT%TZ > "$diag/collect-time.txt"
          { node --version; npm --version; java -version; } > "$diag/tool-versions.txt" 2>&1 || true
          printf '%s\n' "ANDROID_HOME=${ANDROID_HOME:-}" "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" > "$diag/sdk-paths.txt"
          if compiler="$(cd packages/app && node -p "require('node:path').join(require('node:path').dirname(require.resolve('react-native/package.json')), 'sdks/hermesc/osx-bin/hermesc')")" && [ -f "$compiler" ]; then
            printf '%s\n' "$compiler" > "$diag/resolved-hermes-path.txt"
            "$compiler" -version > "$diag/hermes-version.txt" 2>&1 || true
            shasum -a 256 "$compiler" > "$diag/hermes-binary-SHA256SUMS"
          fi
          if [ -f packages/app/android/app/build.gradle ]; then
            cp packages/app/android/app/build.gradle "$diag/generated/app-build.gradle"
          fi
          if [ -f packages/app/android/gradle/wrapper/gradle-wrapper.properties ]; then
            cp packages/app/android/gradle/wrapper/gradle-wrapper.properties "$diag/generated/gradle-wrapper.properties"
          fi
          if [ -d packages/app/android/app/build ]; then
            find packages/app/android/app/build -type f \( -name 'index.android.bundle' -o -name '*.hbc' -o -name 'index.android.bundle*.map' \) -print0 |
              while IFS= read -r -d '' file; do
                relative="${file#packages/app/android/app/build/}"
                mkdir -p "$diag/generated/$(dirname "$relative")"
                if cp "$file" "$diag/generated/$relative"; then
                  (cd "$diag" && shasum -a 256 "generated/$relative") >> "$diag/generated-SHA256SUMS"
                  (cd "$diag" && stat -f '%z %N' "generated/$relative") >> "$diag/generated-bytes.txt"
                else
                  rm -f "$diag/generated/$relative"
                  printf '%s\n' "$relative" >> "$diag/copy-failures.txt"
                fi
              done
          fi
          if [ -d candidate ]; then
            find candidate -type f ! -name '*.apk' -exec cp {} "$diag/" \;
          fi
          printf '%s\n' 'Generated files are snapshots: index.android.bundle can be JS or renamed HBC; incomplete HBC is not a valid APK; missing compiler-return/input hash remains unknown.' > "$diag/limitations.txt"
      - name: Upload existing Android diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: android-candidate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-candidate-evidence/
          retention-days: 7
          if-no-files-found: warn
